# --- JVM / build performance ---
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

# --- AndroidX ---
# buildConfig / nonTransitiveRClass are configured per-module in
# app/build.gradle.kts, because the matching gradle.properties switches were
# deprecated long ago and newer AGP versions reject them outright.
android.useAndroidX=true

# --- Kotlin ---
kotlin.code.style=official
