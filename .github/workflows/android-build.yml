name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 1) JDK 17 (Temurin)
      # ---------------------------------------------------------------
      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ---------------------------------------------------------------
      # 2) Android SDK (build-tools / platform 35)
      # ---------------------------------------------------------------
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install Android platform 35 + build-tools 35.0.0
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      # ---------------------------------------------------------------
      # 3) Generate the Gradle wrapper if it does not exist yet
      #    (there is no local Gradle/Android Studio on the dev machine,
      #     so the wrapper is born here inside the runner)
      # ---------------------------------------------------------------
      - name: Generate Gradle wrapper (8.9) if missing
        run: |
          if [ -f "gradlew" ]; then
            echo ">>> gradlew already present - skipping generation"
          else
            echo ">>> gradlew not found - generating a Gradle 8.9 wrapper"
            # The wrapper task is executed in an EMPTY seed project on purpose.
            # Running it inside our build would configure :app as well, and the
            # preselected Gradle version of the runner might then clash with AGP
            # 8.7.3. In an empty project the task only writes the wrapper files,
            # so it works no matter which Gradle version is installed.
            rm -rf /tmp/wrapper-seed
            mkdir -p /tmp/wrapper-seed
            echo 'rootProject.name = "wrapper-seed"' > /tmp/wrapper-seed/settings.gradle
            (cd /tmp/wrapper-seed && gradle wrapper --gradle-version 8.9 --distribution-type bin)
            cp -r /tmp/wrapper-seed/gradle /tmp/wrapper-seed/gradlew /tmp/wrapper-seed/gradlew.bat .
          fi
          chmod +x ./gradlew
          cat gradle/wrapper/gradle-wrapper.properties || true

      - name: Show generated wrapper files
        run: ls -la gradle/wrapper || true

      # ---------------------------------------------------------------
      # 4) Debug keystore. It is restored from the Actions cache first, so the
      #    SAME key (and therefore the same SHA-1) survives across runs — a
      #    Google "Android" OAuth client is bound to that fingerprint. Only when
      #    the cache is cold is a new key generated (alias my-alias, password
      #    123456, validity 10000 days).
      # ---------------------------------------------------------------
      - name: Restore debug keystore from cache
        uses: actions/cache@v4
        with:
          path: app/keystore.jks
          key: debug-keystore-v1

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f "app/keystore.jks" ]; then
            echo ">>> app/keystore.jks not found - generating a new one"
            keytool -genkeypair \
              -v \
              -keystore app/keystore.jks \
              -alias my-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=Audio App, OU=Personal, O=Personal, L=Tehran, S=Tehran, C=IR"
          else
            echo ">>> app/keystore.jks already exists - keeping the existing key"
          fi

      # ---------------------------------------------------------------
      # 5) Print the SHA-1 fingerprint. It is needed only for a Google Cloud
      #    OAuth client of type "Android"; a "Desktop app" client with the
      #    registered redirect URI does not depend on it.
      # ---------------------------------------------------------------
      - name: Print signing report (SHA-1)
        run: ./gradlew signingReport

      # ---------------------------------------------------------------
      # 6) Build the debug APK
      # ---------------------------------------------------------------
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # ---------------------------------------------------------------
      # 7) Upload artifacts: APK + keystore
      # ---------------------------------------------------------------
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: app/keystore.jks
          if-no-files-found: error
          retention-days: 30
