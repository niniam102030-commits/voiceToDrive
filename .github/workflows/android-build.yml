name: Android Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up JDK 17 (temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK path
        shell: bash
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          if [ -x "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          elif [ -x "$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager" ]; then
            export PATH="$ANDROID_SDK_ROOT/cmdline-tools/16.0/bin:$ANDROID_SDK_ROOT/platform-tools:$ANDROID_SDK_ROOT/emulator:$PATH"
          else
            echo "Android SDK cmdline-tools not found in $ANDROID_SDK_ROOT"
            echo "---- SDK tree ----"
            ls -R "$ANDROID_SDK_ROOT" 2>/dev/null || true
            exit 1
          fi

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "PATH=$PATH" >> "$GITHUB_ENV"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Install Android platform 35 + build-tools 35.0.0
        shell: bash
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Generate Gradle wrapper (8.9) if missing
        shell: bash
        run: |
          if [ -f "gradlew" ]; then
            echo ">>> gradlew already present - skipping generation"
          else
            echo ">>> gradlew not found - generating a Gradle 8.9 wrapper"
            rm -rf /tmp/wrapper-seed
            mkdir -p /tmp/wrapper-seed
            echo 'rootProject.name = "wrapper-seed"' > /tmp/wrapper-seed/settings.gradle
            (cd /tmp/wrapper-seed && gradle wrapper --gradle-version 8.9 --distribution-type bin)
            cp -r /tmp/wrapper-seed/gradle /tmp/wrapper-seed/gradlew /tmp/wrapper-seed/gradlew.bat .
          fi
          chmod +x ./gradlew

      - name: Restore debug keystore from cache
        uses: actions/cache@v4
        with:
          path: app/keystore.jks
          key: debug-keystore-v1

      - name: Generate debug keystore if missing
        run: |
          if [ ! -f "app/keystore.jks" ]; then
            echo ">>> app/keystore.jks not found - generating a new one"
            keytool -genkeypair \
              -v \
              -keystore app/keystore.jks \
              -alias my-alias \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass 123456 \
              -keypass 123456 \
              -dname "CN=Audio App, OU=Personal, O=Personal, L=Tehran, S=Tehran, C=IR"
          else
            echo ">>> app/keystore.jks already exists - keeping the existing key"
          fi

      - name: Print signing report (SHA-1)
        run: ./gradlew signingReport

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: keystore
          path: app/keystore.jks
          if-no-files-found: error
          retention-days: 30
